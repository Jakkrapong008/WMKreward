<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสารสนเทศผลงานครูและนักเรียน - โรงเรียนวัดแม่กะ</title>
    <!-- CSS Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fffaf0; }
        .bg-wmk-red { background-color: #e63946; }
        .text-wmk-red { color: #e63946; }
        .bg-wmk-yellow { background-color: #ffb703; }
        .border-wmk-red { border-color: #e63946; }
        .btn-primary { background-color: #e63946; color: white; transition: all 0.3s; }
        .btn-primary:hover { background-color: #c1121f; transform: translateY(-2px); }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #e63946; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        [data-lucide] { display: inline-block; min-width: 1em; min-height: 1em; }
        
        /* Modal & Animations */
        .mobile-menu-enter { transform: translateY(-100%); transition: transform 0.3s ease-out; }
        .mobile-menu-enter-active { transform: translateY(0); }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Configuration ---
        const CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbyfGtOupJwaNgsBi4X_dRMpxIhFCWowWMieeqw9FroWZbp5oPGBz5Ck_Hq45hK-fVBy/exec",
            LOGO: "https://img2.pic.in.th/logob0b7643db577ceee.png",
            PASSWORD: "wmk"
        };

        const formatThaiDate = (dateStr) => {
            if (!dateStr) return "-";
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            const months = [
                "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
            ];
            const day = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear() + 543;
            return `${day} ${month} ${year}`;
        };

        const getThumbnailUrl = (url) => {
            if (!url || typeof url !== 'string') return null;
            const match = url.match(/[id=|\/d\/]([a-zA-Z0-9_-]{25,})/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            }
            return url;
        };

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (typeof lucide !== 'undefined' && iconRef.current) {
                    lucide.createIcons({ targets: [iconRef.current] });
                }
            }, [name]);
            return <span key={name} className="inline-flex items-center justify-center"><i ref={iconRef} data-lucide={name} className={className} {...props}></i></span>;
        };

        // Custom Modal Component for Alerts and Confirmations
        const CustomDialog = ({ isOpen, title, message, type = 'info', onClose, onConfirm }) => {
            if (!isOpen) return null;
            
            const isConfirm = !!onConfirm;
            const iconName = type === 'error' ? 'alert-triangle' : type === 'success' ? 'check-circle' : 'info';
            const iconColor = type === 'error' ? 'text-red-500' : type === 'success' ? 'text-green-500' : 'text-blue-500';
            const bgLight = type === 'error' ? 'bg-red-50' : type === 'success' ? 'bg-green-50' : 'bg-blue-50';

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay animate-in fade-in duration-200">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-in zoom-in-95 duration-200">
                        <div className="p-6 text-center">
                            <div className={`${bgLight} w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4`}>
                                <Icon name={iconName} className={`${iconColor} w-8 h-8`} />
                            </div>
                            <h3 className="text-xl font-bold text-gray-800 mb-2">{title}</h3>
                            <p className="text-gray-600 text-sm whitespace-pre-wrap">{message}</p>
                        </div>
                        <div className="p-4 bg-gray-50 flex gap-3 justify-center">
                            {isConfirm ? (
                                <>
                                    <button onClick={onClose} className="px-6 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl font-bold hover:bg-gray-100 transition-colors w-full">ยกเลิก</button>
                                    <button onClick={() => { onConfirm(); onClose(); }} className="px-6 py-2.5 bg-wmk-red text-white rounded-xl font-bold hover:bg-red-700 transition-colors w-full">ยืนยัน</button>
                                </>
                            ) : (
                                <button onClick={onClose} className="px-6 py-2.5 bg-wmk-red text-white rounded-xl font-bold hover:bg-red-700 transition-colors w-full">ตกลง</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [isAuth, setIsAuth] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [pendingAction, setPendingAction] = useState(null);
            const [records, setRecords] = useState([]);
            const [loading, setLoading] = useState(false);
            const [selectedRecord, setSelectedRecord] = useState(null);
            const [editRecordData, setEditRecordData] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Dialog states
            const [dialogConfig, setDialogConfig] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null });

            const showAlert = (message, title = 'แจ้งเตือน', type = 'info') => {
                setDialogConfig({ isOpen: true, message, title, type, onConfirm: null });
            };

            const showConfirm = (message, title, onConfirm) => {
                setDialogConfig({ isOpen: true, message, title, type: 'info', onConfirm });
            };

            const closeDialog = () => setDialogConfig({ ...dialogConfig, isOpen: false });

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${CONFIG.API_URL}?action=getRecords`);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setRecords(data);
                    }
                } catch (e) { 
                    console.error("Error fetching data", e); 
                    showAlert("ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง", "ข้อผิดพลาด", "error");
                } finally {
                    setLoading(false);
                }
            };

            const requireAuth = (actionFn) => {
                if (isAuth) {
                    actionFn();
                } else {
                    setPendingAction(() => actionFn);
                    setShowAuthModal(true);
                }
            };

            const handleAuth = (pwd) => {
                if(pwd === CONFIG.PASSWORD) {
                    setIsAuth(true);
                    setShowAuthModal(false);
                    if (pendingAction) {
                        pendingAction();
                        setPendingAction(null);
                    } else {
                        setView('record');
                        setIsMobileMenuOpen(false);
                    }
                } else {
                    showAlert("รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง", "ตรวจสอบรหัสผ่าน", "error");
                }
            };

            const navigate = (target) => {
                if (target === 'record') {
                    requireAuth(() => {
                        setEditRecordData(null);
                        setView('record');
                    });
                } else {
                    setView(target);
                }
                setIsMobileMenuOpen(false);
            };

            const executeDelete = async (record) => {
                setLoading(true);
                try {
                    const res = await fetch(CONFIG.API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify({ 
                            action: 'deleteRecord', 
                            _timestamp: record._timestamp 
                        })
                    });
                    
                    const result = await res.json();
                    if (result.status === 'error') throw new Error(result.message);
                    
                    showAlert("ลบข้อมูลผลงานเรียบร้อยแล้ว", "สำเร็จ", "success");
                    fetchData();
                    setSelectedRecord(null);
                } catch (e) {
                    showAlert("เกิดข้อผิดพลาดในการลบข้อมูล: " + e.message, "ข้อผิดพลาด", "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteRecord = (record) => {
                showConfirm(`ยืนยันการลบผลงาน "${record.activityName}" ใช่หรือไม่?\nข้อมูลจะไม่สามารถกู้คืนได้เมื่อลบไปแล้ว`, 'ยืนยันการลบ', () => executeDelete(record));
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation Bar */}
                    <nav className="bg-wmk-red text-white shadow-lg sticky top-0 z-40">
                        <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <img src={CONFIG.LOGO} alt="Logo" className="h-10 w-10 md:h-12 md:w-12 object-contain bg-white rounded-full p-1 shadow-sm" />
                                <div>
                                    <h1 className="font-bold text-sm md:text-lg leading-tight">ระบบสารสนเทศผลงานครูและนักเรียน</h1>
                                    <p className="text-[10px] md:text-xs text-yellow-200">โรงเรียนวัดแม่กะ</p>
                                </div>
                            </div>
                            
                            {/* Desktop Menu */}
                            <div className="hidden md:flex gap-6 items-center">
                                <button onClick={() => navigate('dashboard')} className={`hover:text-yellow-300 transition-colors ${view === 'dashboard' ? 'text-yellow-300 font-bold underline' : ''}`}>สรุปผล</button>
                                <button onClick={() => navigate('list')} className={`hover:text-yellow-300 transition-colors ${view === 'list' ? 'text-yellow-300 font-bold underline' : ''}`}>สืบค้นข้อมูล</button>
                                <button 
                                    onClick={() => navigate('record')} 
                                    className="bg-wmk-yellow text-black px-4 py-2 rounded-full font-bold flex items-center gap-2 hover:scale-105 transition-transform shadow-md"
                                >
                                    <Icon name="plus-circle" className="w-4 h-4" />
                                    บันทึกผลงาน
                                </button>
                            </div>

                            {/* Mobile Menu Toggle */}
                            <div className="md:hidden">
                                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-white outline-none">
                                    <Icon name={isMobileMenuOpen ? "x" : "menu"} className="w-6 h-6" />
                                </button>
                            </div>
                        </div>

                        {/* Mobile Menu Content */}
                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-wmk-red border-t border-red-400 py-4 px-6 flex flex-col gap-4 animate-in fade-in slide-in-from-top-4 duration-200">
                                <button onClick={() => navigate('dashboard')} className="flex items-center gap-3 text-left py-2 font-bold hover:text-yellow-300">
                                    <Icon name="bar-chart-3" /> สรุปผล
                                </button>
                                <button onClick={() => navigate('list')} className="flex items-center gap-3 text-left py-2 font-bold hover:text-yellow-300">
                                    <Icon name="search" /> สืบค้นข้อมูล
                                </button>
                                <button onClick={() => navigate('record')} className="flex items-center gap-3 text-left py-2 font-bold text-yellow-300">
                                    <Icon name="plus-circle" /> บันทึกผลงาน
                                </button>
                            </div>
                        )}
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-grow container mx-auto px-4 py-8 relative">
                        {/* Loading Overlay */}
                        {loading && (
                            <div className="fixed inset-0 bg-black/30 backdrop-blur-sm flex flex-col items-center justify-center z-50 transition-opacity">
                                <div className="loader bg-white p-2"></div>
                                <div className="bg-white px-6 py-2 rounded-full mt-4 shadow-lg">
                                    <p className="font-bold text-wmk-red">กำลังประมวลผล...</p>
                                </div>
                            </div>
                        )}
                        
                        {/* Views Routing */}
                        <div key={view}>
                            {view === 'dashboard' && <Dashboard records={records} />}
                            {view === 'record' && (
                                <RecordForm 
                                    initialData={editRecordData} 
                                    showAlert={showAlert}
                                    onSuccess={() => { fetchData(); setView('list'); setEditRecordData(null); }} 
                                    onCancel={editRecordData ? () => { setView('list'); setEditRecordData(null); } : undefined}
                                />
                            )}
                            {view === 'list' && <ListView records={records} onSelect={setSelectedRecord} />}
                        </div>
                    </main>

                    {/* Record Detail Modal */}
                    {selectedRecord && (
                        <DetailModal 
                            record={selectedRecord} 
                            onClose={() => setSelectedRecord(null)}
                            onEdit={(record) => requireAuth(() => {
                                setEditRecordData(record);
                                setView('record');
                                setSelectedRecord(null);
                            })}
                            onDelete={(record) => requireAuth(() => handleDeleteRecord(record))}
                        />
                    )}

                    {/* Authentication Modal */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4 animate-in fade-in">
                            <div className="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl animate-in zoom-in-95">
                                <div className="text-center mb-6">
                                    <div className="bg-red-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icon name="lock" className="text-wmk-red w-8 h-8" />
                                    </div>
                                    <h2 className="text-2xl font-bold">ยืนยันตัวตน</h2>
                                    <p className="text-gray-500 text-sm mt-1">กรุณาใส่รหัสผ่านเพื่อดำเนินการต่อ</p>
                                </div>
                                <input 
                                    type="password" 
                                    id="pwdInput"
                                    autoFocus
                                    className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 mb-6 focus:border-wmk-red outline-none transition-colors" 
                                    placeholder="Password"
                                    onKeyDown={(e) => e.key === 'Enter' && handleAuth(e.target.value)}
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => { setShowAuthModal(false); setPendingAction(null); }} className="flex-1 py-3 text-gray-600 font-bold bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors">ยกเลิก</button>
                                    <button onClick={() => handleAuth(document.getElementById('pwdInput').value)} className="flex-1 btn-primary py-3 rounded-xl font-bold shadow-md">ยืนยันรหัส</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Global Custom Dialog Component */}
                    <CustomDialog 
                        isOpen={dialogConfig.isOpen}
                        title={dialogConfig.title}
                        message={dialogConfig.message}
                        type={dialogConfig.type}
                        onClose={closeDialog}
                        onConfirm={dialogConfig.onConfirm}
                    />

                    {/* Footer */}
                    <footer className="bg-white py-6 text-center text-gray-500 text-sm border-t shadow-inner mt-12">
                        จัดทำโดย ฝ่ายบริหารงานบุคคล โรงเรียนวัดแม่กะ
                    </footer>
                </div>
            );
        };

        const Dashboard = ({ records }) => {
            const [filters, setFilters] = useState({ 
                year: '', category: '', status: '', level: '', startDate: '', endDate: '' 
            });
            const pieCanvasRef = useRef(null);
            const barCanvasRef = useRef(null);
            const doughnutCanvasRef = useRef(null);
            const formatCanvasRef = useRef(null);
            const chartInstances = useRef({});

            const filtered = useMemo(() => {
                return records.filter(r => {
                    const matchesYear = !filters.year || String(r.year) === filters.year;
                    const matchesCat = !filters.category || String(r.category) === filters.category;
                    const matchesStatus = !filters.status || String(r.status) === filters.status;
                    const matchesLevel = !filters.level || String(r.level) === filters.level;
                    
                    let matchesDate = true;
                    if (filters.startDate && filters.endDate) {
                        const start = new Date(filters.startDate);
                        const end = new Date(filters.endDate);
                        const recordDate = new Date(r.startDate);
                        matchesDate = recordDate >= start && recordDate <= end;
                    } else if (filters.startDate) {
                        const start = new Date(filters.startDate);
                        const recordDate = new Date(r.startDate);
                        matchesDate = recordDate >= start;
                    } else if (filters.endDate) {
                        const end = new Date(filters.endDate);
                        const recordDate = new Date(r.startDate);
                        matchesDate = recordDate <= end;
                    }
                    return matchesYear && matchesCat && matchesStatus && matchesLevel && matchesDate;
                });
            }, [records, filters]);
            
            const stats = useMemo(() => {
                const total = filtered.length;
                const teacherCount = filtered.filter(r => ['ครู', 'ผู้บริหาร', 'เจ้าหน้าที่'].includes(r.status)).length;
                const studentCount = filtered.filter(r => r.status === 'นักเรียน').length;
                
                const cats = {};
                filtered.forEach(r => cats[r.category] = (cats[r.category] || 0) + 1);
                
                const lvls = {};
                filtered.forEach(r => lvls[r.level] = (lvls[r.level] || 0) + 1);

                const statuses = {};
                filtered.forEach(r => statuses[r.status] = (statuses[r.status] || 0) + 1);

                const formats = { 'on-site': 0, 'online': 0 };
                filtered.forEach(r => {
                    const f = (r.format || 'on-site').toLowerCase();
                    formats[f] = (formats[f] || 0) + 1;
                });

                return { total, teacherCount, studentCount, cats, lvls, statuses, formats };
            }, [filtered]);

            useEffect(() => {
                const renderCharts = () => {
                    Object.values(chartInstances.current).forEach(chart => chart.destroy());
                    
                    if (pieCanvasRef.current) {
                        chartInstances.current.pie = new Chart(pieCanvasRef.current, {
                            type: 'pie',
                            data: {
                                labels: Object.keys(stats.cats),
                                datasets: [{ data: Object.values(stats.cats), backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#6366f1'] }]
                            },
                            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 10 } } } } }
                        });
                    }

                    if (barCanvasRef.current) {
                        chartInstances.current.bar = new Chart(barCanvasRef.current, {
                            type: 'bar',
                            data: {
                                labels: Object.keys(stats.statuses),
                                datasets: [{ 
                                    label: 'จำนวนผลงาน', 
                                    data: Object.values(stats.statuses), 
                                    backgroundColor: ['#e63946', '#ffb703', '#3b82f6', '#10b981'] 
                                }]
                            },
                            options: { 
                                maintainAspectRatio: false,
                                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }, 
                                plugins: { legend: { display: false } } 
                            }
                        });
                    }

                    if (doughnutCanvasRef.current) {
                        chartInstances.current.doughnut = new Chart(doughnutCanvasRef.current, {
                            type: 'doughnut',
                            data: {
                                labels: Object.keys(stats.lvls),
                                datasets: [{ data: Object.values(stats.lvls), backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#6366f1', '#475569'] }]
                            },
                            options: { cutout: '60%', maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 10 } } } } }
                        });
                    }

                    if (formatCanvasRef.current) {
                        chartInstances.current.format = new Chart(formatCanvasRef.current, {
                            type: 'doughnut',
                            data: {
                                labels: ['On-site', 'Online'],
                                datasets: [{ 
                                    data: [stats.formats['on-site'], stats.formats['online']], 
                                    backgroundColor: ['#e63946', '#3b82f6'] 
                                }]
                            },
                            options: { cutout: '60%', maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 10 } } } } }
                        });
                    }
                };
                const timeoutId = setTimeout(renderCharts, 100);
                return () => { clearTimeout(timeoutId); Object.values(chartInstances.current).forEach(chart => chart.destroy()); };
            }, [stats]);

            return (
                <div className="space-y-6 animate-in fade-in duration-500">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                        <h2 className="text-2xl md:text-3xl font-bold flex items-center gap-2 text-wmk-red">
                            <Icon name="bar-chart-3" className="w-8 h-8" />
                            สรุปข้อมูลภาพรวม
                        </h2>
                    </div>

                    {/* Dashboard Filters */}
                    <div className="card p-5 border-t-4 border-wmk-red bg-red-50/30">
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7 gap-3">
                            <div className="flex flex-col gap-1">
                                <label className="text-[10px] font-bold text-gray-500 px-1 uppercase tracking-wider">ปีการศึกษา</label>
                                <select className="border-gray-300 rounded-lg p-2 text-xs bg-white shadow-sm focus:border-wmk-red focus:ring-1 focus:ring-wmk-red outline-none" value={filters.year} onChange={e => setFilters({...filters, year: e.target.value})}>
                                    <option value="">ทุกปี</option>
                                    <option value="2568">2568</option>
                                    <option value="2569">2569</option>
                                </select>
                            </div>
                            <div className="flex flex-col gap-1">
                                <label className="text-[10px] font-bold text-gray-500 px-1 uppercase tracking-wider">ประเภท</label>

                                    <span className="bg-wmk-red text-white px-3 py-1 rounded-md text-[10px] font-bold shadow-sm">{record.category}</span>
                                    <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-md text-[10px] font-bold shadow-sm">{record.status}</span>

                                    <InfoRow icon="users" label="ชื่อผู้รับผิดชอบ" value={record.names} />
                                    <InfoRow icon="award" label="สิ่งที่ได้รับ / ผลสำเร็จ" value={record.result} />
                                    <InfoRow icon="clock" label="จำนวนชั่วโมง" value={record.hours > 0 ? `${record.hours} ชั่วโมง` : '-'} />
                                    <InfoRow icon="calendar" label="ระยะเวลา" value={`${formatThaiDate(record.startDate)} ถึง ${formatThaiDate(record.endDate)}`} />

                                        <p className="text-[10px] text-gray-400 font-bold uppercase mb-2 tracking-wider flex items-center gap-2"><Icon name="align-left" className="w-3 h-3" /> รายละเอียดเพิ่มเติม</p>
                                        <p className="text-gray-700 text-sm whitespace-pre-wrap leading-relaxed">{record.details || '-'}</p>
                                    </div>
                                </div>
                                
                                <div>

                                    <div className="grid grid-cols-2 gap-4">
                                        {record.files && record.files.filter(url => url && url !== "").map((url, i) => (
                                            <a key={i} href={getDirectUrl(url)} target="_blank" rel="noopener noreferrer" className="block border border-gray-200 rounded-2xl p-2.5 hover:border-wmk-red hover:shadow-lg transition-all group overflow-hidden bg-white relative">
                                                <div className="h-28 bg-gray-50 rounded-xl mb-3 overflow-hidden flex items-center justify-center relative border border-gray-100">
                                                    {isImage(url) ? (
                                                        <img src={getThumbnailUrl(url)} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="" />
                                                    ) : (
                                                        <div className="text-center">
                                                            <Icon name="file-text" className="w-10 h-10 text-blue-300 mx-auto" />
                                                            <span className="text-[9px] font-bold text-gray-400 uppercase mt-1 block">Document</span>
                                                        </div>
                                                    )}
                                                    <div className="absolute inset-0 bg-wmk-red/80 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                                                        <Icon name="download" className="text-white w-8 h-8 drop-shadow-md" />
                                                    </div>
                                                </div>
                                                <p className="text-[10px] text-gray-600 truncate text-center font-bold px-1 group-hover:text-wmk-red transition-colors">ไฟล์แนบ {i+1}</p>
                                            </a>
                                        ))}
                                        {(!record.files || record.files.filter(url => url !== "").length === 0) && (
                                            <div className="col-span-2 py-16 text-center bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                                                <Icon name="folder-open" className="w-12 h-12 text-gray-300 mx-auto mb-2" />
                                                <p className="text-gray-400 font-bold text-xs">ไม่มีไฟล์แนบในผลงานนี้</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Footer Actions Sticky */}
                        <div className="p-6 border-t border-gray-100 bg-gray-50 flex flex-col sm:flex-row justify-end gap-3 rounded-b-3xl">
                            <button onClick={() => onEdit(record)} className="flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition-transform hover:-translate-y-0.5">
                                <Icon name="edit" className="w-4 h-4" /> แก้ไขข้อมูล
                            </button>
                            <button onClick={() => onDelete(record)} className="flex items-center justify-center gap-2 px-6 py-3 bg-white border-2 border-red-100 text-red-500 font-bold rounded-xl shadow-sm hover:bg-red-50 hover:border-red-200 transition-transform hover:-translate-y-0.5">
                                <Icon name="trash-2" className="w-4 h-4" /> ลบข้อมูล
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const InfoRow = ({ icon, label, value }) => (
            <div className="flex gap-4 items-center">
                <div className="bg-white p-3 rounded-2xl h-12 w-12 flex items-center justify-center flex-shrink-0 text-wmk-red shadow-sm border border-gray-100"><Icon name={icon} className="w-5 h-5" /></div>
                <div className="overflow-hidden">
                    <p className="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-0.5">{label}</p>
                    <p className="text-gray-800 font-semibold text-sm leading-tight truncate">{value || '-'}</p>
                </div>
            </div>
        );

        const RecordForm = ({ onSuccess, initialData, onCancel, showAlert }) => {
            const isEditMode = !!initialData;
            
            const [formData, setFormData] = useState({
                year: '2569', names: '', status: 'นักเรียน', category: 'การอบรม', activityName: '',
                result: 'เข้าร่วม', resultCustom: '', details: '', hours: '0', level: 'โรงเรียน',
                startDate: '', endDate: '', format: 'on-site', agency: '', location: ''
            });
            const [fileSlots, setFileSlots] = useState(Array(10).fill(null));
            const [uploading, setUploading] = useState(false);

            useEffect(() => {
                if (initialData) {
                    const standardResults = ['เข้าร่วม','การเป็นวิทยากร','การเป็นคณะทำงาน','การเป็นคณะกรรมการ','รางวัลชนะเลิศ','รางวัลรองชนะเลิศ อันดับ 1','รางวัลรองชนะเลิศ อันดับ 2','รางวัลชมเชย','รางวัลระดับเหรียญทอง','รางวัลระดับเหรียญเงิน','รางวัลระดับเหรียญทองแดง','รางวัลระดับดีเด่น','รางวัลระดับดีเยี่ยม'];
                    const isCustomResult = !standardResults.includes(initialData.result);
                    
                    const dateFmt = (d) => {
                        if(!d) return '';
                        try { return new Date(d).toISOString().split('T')[0]; } catch(e) { return ''; }
                    }

                    setFormData({
                        ...initialData,
                        startDate: dateFmt(initialData.startDate),
                        endDate: dateFmt(initialData.endDate),
                        result: isCustomResult ? 'อื่นๆ' : initialData.result,
                        resultCustom: isCustomResult ? initialData.result : ''
                    });

                    const existingFiles = Array(10).fill(null);
                    if (initialData.files) {
                        initialData.files.forEach((url, idx) => {
                            if (url && url !== "" && idx < 10) {
                                existingFiles[idx] = { name: `ไฟล์แนบเดิม ${idx + 1}`, url: url };
                            }
                        });
                    }
                    setFileSlots(existingFiles);
                }
            }, [initialData]);

            const handleFileChange = (index, file) => {
                const newSlots = [...fileSlots];
                newSlots[index] = file;
                setFileSlots(newSlots);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setUploading(true);
                try {
                    const fileData = await Promise.all(
                        fileSlots.map(file => {
                            if (!file) return Promise.resolve(null);
                            if (file.url) return Promise.resolve({ url: file.url }); // Keep old file
                            return new Promise((resolve) => { // Upload new file
                                const reader = new FileReader();
                                reader.onload = (e) => resolve({
                                    name: file.name,
                                    type: file.type,
                                    base64: e.target.result.split(',')[1]
                                });
                                reader.readAsDataURL(file);
                            });
                        })
                    );

                    const payload = {
                        action: isEditMode ? 'updateRecord' : 'saveRecord',
                        _timestamp: initialData ? initialData._timestamp : undefined,
                        ...formData,
                        result: formData.result === 'อื่นๆ' ? formData.resultCustom : formData.result,
                        files: fileData
                    };

                    // **สำคัญมาก** ไม่ใส่ mode: 'no-cors' และเปลี่ยน Content-Type เป็น text/plain 
                    // เพื่อแก้ปัญหาเบราว์เซอร์บล็อก (CORS) ในการส่ง JSON ไป Google Script
                    const res = await fetch(CONFIG.API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await res.json();
                    if (result.status === 'error') throw new Error(result.message);
                    
                    showAlert(isEditMode ? "อัปเดตข้อมูลการแก้ไขผลงานเรียบร้อยแล้ว" : "ส่งข้อมูลบันทึกผลงานเรียบร้อยแล้ว", "บันทึกสำเร็จ", "success");
                    onSuccess();
                } catch (e) {
                    showAlert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + e.message, "ข้อผิดพลาด", "error");
                } finally {
                    setUploading(false);
                }
            };

            const headerColorClass = isEditMode ? 'text-blue-600' : 'text-wmk-red';
            const borderColorClass = isEditMode ? 'border-blue-500' : 'border-wmk-red';
            const btnColorClass = isEditMode ? 'bg-blue-600 hover:bg-blue-700' : 'btn-primary';

            return (
                <div className="max-w-4xl mx-auto animate-in slide-in-from-bottom-10 duration-500 pb-12">
                    <div className="flex items-center justify-between mb-8">
                        <h2 className={`text-2xl md:text-3xl font-bold flex items-center gap-3 ${headerColorClass}`}>
                            <div className={`p-2 rounded-xl ${isEditMode ? 'bg-blue-50' : 'bg-red-50'}`}>
                                <Icon name={isEditMode ? "edit" : "plus-circle"} className="w-8 h-8" /> 
                            </div>
                            {isEditMode ? 'แก้ไขข้อมูลผลงาน' : 'บันทึกข้อมูลผลงานใหม่'}
                        </h2>
                    </div>

                    <form onSubmit={handleSubmit} className={`card p-6 md:p-10 space-y-8 border-t-8 shadow-2xl ${borderColorClass}`}>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            <div className="space-y-6">
                                <label className="block">
                                    <span className="text-gray-700 font-bold text-sm mb-2 block">ปีการศึกษา</span>
                                    <select className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" value={formData.year} onChange={e => setFormData({...formData, year: e.target.value})}><option value="2568">2568</option><option value="2569">2569</option></select>
                                </label>
                                <label className="block">
                                    <span className="text-gray-700 font-bold text-sm mb-2 block">สถานะ</span>
                                    <select className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})}><option value="นักเรียน">นักเรียน</option><option value="ครู">ครู</option><option value="ผู้บริหาร">ผู้บริหาร</option><option value="เจ้าหน้าที่">เจ้าหน้าที่</option></select>
                                </label>
                            </div>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">ชื่อผู้รับผิดชอบ <span className="text-xs text-gray-400 font-normal">(คั่นด้วยเครื่องหมาย ,)</span></span>
                                <textarea className="block w-full border border-gray-300 rounded-xl p-3 h-[126px] text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all resize-none" placeholder="เช่น นายสมชาย ใจดี, ด.ญ.สมหญิง น่ารัก" required value={formData.names} onChange={e => setFormData({...formData, names: e.target.value})}></textarea>
                            </label>

                            <div className="md:col-span-2 h-px bg-gray-100 my-2"></div>
                            
                            <label className="block md:col-span-2">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">ชื่อกิจกรรม / โครงการ</span>
                                <input type="text" className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" required value={formData.activityName} onChange={e => setFormData({...formData, activityName: e.target.value})} />
                            </label>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">ประเภทกิจกรรม</span>
                                <select className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>{['การอบรม','การประชุม','การเป็นวิทยากร','รางวัลครู','รางวัลนักเรียน','คณะทำงาน','คณะกรรมการ'].map(c => <option key={c} value={c}>{c}</option>)}</select>
                            </label>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">สิ่งที่ได้รับ / ผลสำเร็จ</span>
                                <div className="flex gap-2">
                                    <select className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all flex-grow" value={formData.result} onChange={e => setFormData({...formData, result: e.target.value})}>{['เข้าร่วม','การเป็นวิทยากร','การเป็นคณะทำงาน','การเป็นคณะกรรมการ','รางวัลชนะเลิศ','รางวัลรองชนะเลิศ อันดับ 1','รางวัลรองชนะเลิศ อันดับ 2','รางวัลชมเชย','รางวัลระดับเหรียญทอง','รางวัลระดับเหรียญเงิน','รางวัลระดับเหรียญทองแดง','รางวัลระดับดีเด่น','รางวัลระดับดีเยี่ยม','อื่นๆ'].map(r => <option key={r} value={r}>{r}</option>)}</select>
                                    {formData.result === 'อื่นๆ' && <input type="text" placeholder="ระบุ..." className="block w-1/2 border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all animate-in fade-in zoom-in-95" required value={formData.resultCustom} onChange={e => setFormData({...formData, resultCustom: e.target.value})} />}
                                </div>
                            </label>

                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">จำนวนชั่วโมง <span className="text-xs text-gray-400 font-normal">(ใส่ 0 หากไม่มี)</span></span>
                                <input type="number" min="0" className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" value={formData.hours} onChange={e => setFormData({...formData, hours: e.target.value})} />
                            </label>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">งานระดับ</span>
                                <select className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" value={formData.level} onChange={e => setFormData({...formData, level: e.target.value})}>{['โรงเรียน','ตำบล','อำเภอ','เครือข่ายพัฒนาคุณภาพการศึกษา','เขตพื้นที่การศึกษา','จังหวัด','ภาค','เขตตรวจราชการ','ประเทศ','นานาชาติ'].map(l => <option key={l} value={l}>{l}</option>)}</select>
                            </label>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">ตั้งแต่วันที่</span>
                                <input type="date" className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" required value={formData.startDate} onChange={e => setFormData({...formData, startDate: e.target.value})} />
                            </label>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">ถึงวันที่</span>
                                <input type="date" className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" required value={formData.endDate} onChange={e => setFormData({...formData, endDate: e.target.value})} />
                            </label>

                            <div className="md:col-span-2 h-px bg-gray-100 my-2"></div>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">รูปแบบกิจกรรม</span>
                                <select className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" value={formData.format} onChange={e => setFormData({...formData, format: e.target.value})}><option value="on-site">On-site</option><option value="online">Online</option></select>
                            </label>
                            
                            <label className="block">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">หน่วยงานที่จัด</span>
                                <input type="text" className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" placeholder="เช่น สพฐ., มหาวิทยาลัยเชียงใหม่" value={formData.agency} onChange={e => setFormData({...formData, agency: e.target.value})} />
                            </label>
                            
                            <label className="block md:col-span-2">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">สถานที่จัดกิจกรรม</span>
                                <input type="text" className="block w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} />
                            </label>
                            
                            <label className="block md:col-span-2">
                                <span className="text-gray-700 font-bold text-sm mb-2 block">รายละเอียดของงาน (เพิ่มเติม)</span>
                                <textarea className="block w-full border border-gray-300 rounded-xl p-4 text-sm outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 bg-gray-50 focus:bg-white transition-all resize-none" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม..." value={formData.details} onChange={e => setFormData({...formData, details: e.target.value})}></textarea>
                            </label>

                            {}
                            <div className="md:col-span-2 mt-4 bg-gray-50/50 p-6 rounded-2xl border border-gray-200 shadow-inner">
                                <h3 className={`text-lg font-bold mb-5 flex items-center gap-2 ${headerColorClass}`}><Icon name="paperclip" className="w-5 h-5" /> รูปภาพและไฟล์แนบ (สูงสุด 10 ไฟล์)</h3>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
                                    {fileSlots.map((slot, idx) => (
                                        <div key={idx} className="relative group">
                                            <label className={`flex flex-col items-center justify-center h-28 border-2 border-dashed rounded-2xl cursor-pointer transition-all shadow-sm overflow-hidden ${slot ? (slot.url ? 'border-blue-400 bg-blue-50/50' : 'border-green-400 bg-green-50/50') : 'border-gray-300 hover:border-gray-400 hover:bg-gray-50 bg-white'}`}>
                                                {slot ? (
                                                    <div className="text-center px-2 w-full flex flex-col items-center">
                                                        <Icon name={slot.url ? "link" : "check-circle"} className={`${slot.url ? 'text-blue-500' : 'text-green-500'} w-8 h-8 mb-2 drop-shadow-sm`} />
                                                        <p className={`text-[9px] ${slot.url ? 'text-blue-700' : 'text-green-700'} truncate font-bold uppercase w-full`}>{slot.name}</p>
                                                    </div>
                                                ) : (
                                                    <div className="text-center text-gray-400 group-hover:text-gray-500 transition-colors">
                                                        <Icon name="plus-circle" className="w-8 h-8 mx-auto mb-2 opacity-50 group-hover:opacity-100 transition-opacity" />
                                                        <p className="text-[10px] font-bold">ช่องที่ {idx + 1}</p>
                                                    </div>
                                                )}
                                                <input type="file" className="hidden" accept="image/*,application/pdf" onChange={e => handleFileChange(idx, e.target.files[0] || null)} />
                                            </label>
                                            {slot && <button type="button" onClick={() => handleFileChange(idx, null)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1.5 shadow-lg hover:bg-red-600 transition-transform hover:scale-110 z-10"><Icon name="x" className="w-3 h-3" /></button>}
                                        </div>
                                    ))}
                                </div>
                                <p className="text-xs text-gray-400 mt-4 text-center"><Icon name="info" className="w-3 h-3 inline pb-0.5" /> รองรับไฟล์รูปภาพ (.jpg, .png) และไฟล์ PDF ขนาดไม่ควรเกิน 5MB ต่อไฟล์</p>
                            </div>
                        </div>

                        <div className="pt-8 border-t border-gray-100 flex flex-col md:flex-row justify-center gap-4">
                            {onCancel ? (
                                <button type="button" onClick={onCancel} className="px-10 py-3.5 text-gray-600 font-bold border-2 border-gray-200 rounded-xl hover:bg-gray-50 text-sm transition-colors w-full md:w-auto text-center">ยกเลิกการแก้ไข</button>
                            ) : (
                                <button type="button" onClick={() => window.location.reload()} className="px-10 py-3.5 text-gray-500 font-bold border-2 border-gray-100 rounded-xl hover:bg-gray-50 text-sm transition-colors w-full md:w-auto text-center">ล้างข้อมูลฟอร์ม</button>
                            )}
                            <button type="submit" disabled={uploading} className={`${btnColorClass} text-white px-12 py-3.5 rounded-xl font-bold flex items-center justify-center gap-3 shadow-xl w-full md:w-auto transition-transform hover:-translate-y-0.5 ${uploading ? 'opacity-70 cursor-wait' : ''}`}>
                                {uploading ? <><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> {isEditMode ? 'กำลังอัปเดตข้อมูล...' : 'กำลังอัปโหลดและบันทึก...'}</> : <><Icon name={isEditMode ? 'save' : 'send'} className="w-5 h-5" /> {isEditMode ? 'บันทึกการแก้ไข' : 'ยืนยันการบันทึกผลงาน'}</>}
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
